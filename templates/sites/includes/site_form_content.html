{% load crispy_forms_tags %}
<div class="row g-3">
    <div class="col-md-6">
        <label class="form-label">Site Name *</label>
        {{ form.site_name }}
        {% if form.site_name.errors %}<div class="text-danger small">{{ form.site_name.errors }}</div>{% endif %}
    </div>
    <div class="col-md-6">
        <label class="form-label">Emirate</label>
        {{ form.emirate }}
    </div>
    <div class="col-md-12">
        <label class="form-label">Location</label>
        {{ form.location }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Start Date</label>
        {{ form.start_date }}
    </div>
    <div class="col-md-6">
        <label class="form-label">End Date</label>
        {{ form.end_date }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Manager</label>
        {{ form.manager }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Status</label>
        {{ form.status }}
    </div>
    <div class="col-md-12">
        <label class="form-label">Notes</label>
        {{ form.notes }}
    </div>
</div>
