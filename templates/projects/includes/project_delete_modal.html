<!-- Project Delete Modal Template -->
<div class="modal fade" id="projectDeleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="projectDeleteForm" method="post">
                {% csrf_token %}
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body text-center py-4">
                    <i class="bi bi-trash display-1 text-danger mb-3"></i>
                    <h5>Are you sure you want to delete this project?</h5>
                    <p class="text-muted mb-3">{{ project.project_name }}</p>
                    <div class="alert alert-warning" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <strong>Warning:</strong> This action cannot be undone.
                    </div>

                    <div class="text-start bg-light p-3 rounded">
                        <div class="row">
                            <div class="col-6">
                                <small class="text-muted">Status</small>
                                <div>{{ project.status }}</div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Manager</small>
                                <div>{{ project.manager.get_full_name|default:'-' }}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </button>
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-check-lg me-1"></i>Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
